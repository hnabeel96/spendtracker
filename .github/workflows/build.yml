name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle :app:assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Unit tests (SMS parser)
        run: gradle :app:testReleaseUnitTest 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: Report errors as annotations
        if: failure()
        run: |
          cat build.log test.log 2>/dev/null | grep -E "^e: |error:|FAILED|Exception|expected:|What went wrong" -A2 | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          for f in app/build/test-results/testReleaseUnitTest/*.xml; do grep -A3 "<failure" "$f" | head -8 | while IFS= read -r l; do echo "::error::$l"; done; done 2>/dev/null || true

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Ledger-build-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ledger-build-${{ github.run_number }}
          path: Ledger-build-${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ledger build ${{ github.run_number }}
          files: Ledger-build-${{ github.run_number }}.apk
          make_latest: true
