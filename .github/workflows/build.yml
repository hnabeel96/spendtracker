name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests (SMS parser)
        run: gradle :app:testReleaseUnitTest --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Ledger-build-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ledger-build-${{ github.run_number }}
          path: Ledger-build-${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ledger build ${{ github.run_number }}
          files: Ledger-build-${{ github.run_number }}.apk
          make_latest: true
